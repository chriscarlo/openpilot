[package]
name = "vtsc_tuner"
version = "0.1.0"
edition = "2024"
description = "Interactive VTSC sigmoid tuner (Vision Turn Speed Control)."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
dirs = "6"
eframe = { version = "0.33", default-features = false, features = [
  "glow",
  "default_fonts",
  "x11",
] }
libc = "0.2.185"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# winit is re-exported by eframe; pulled in explicitly so we can force X11.
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
